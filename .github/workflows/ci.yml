name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python and shell syntax
        run: |
          python -m compileall -q zigscan_app.py tools
          bash -n setup.sh build-macos.sh zigscan
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify publication exclusions
        run: |
          for candidate in .venv/bin/python dist/zigscan.dmg build/zigscan captures/client.pcap tools/catsniffer-tools/README.md tools/__pycache__/module.pyc; do
            git check-ignore -q "$candidate" || { echo "Expected ignored path: $candidate"; exit 1; }
          done
          if git check-ignore -q samples/public-demo.pcap; then
            echo "samples/*.pcap must remain eligible for an explicitly reviewed demo capture"
            exit 1
          fi
