name: Field validation
description: Share verified hardware, firmware or OUI evidence
title: "[Field validation]: "
body:
  - type: markdown
    attributes:
      value: |
        Field evidence helps expand the tested matrix. Do not attach customer captures or expose network keys and identifiers.
  - type: input
    id: hardware
    attributes:
      label: Hardware model and revision
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version or role
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Validation type
      options:
        - CatSniffer capture or sweep
        - Device observed passively
        - OUI/vendor confirmation
        - Other RF-band confirmation
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Redacted evidence and method
    validations:
      required: true
